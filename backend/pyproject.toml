[project]
name = "sham-erp-backend"
version = "0.1.0"
description = "Sham ERP backend (FastAPI) — deployable ERP for food manufacturing/distribution companies"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "redis>=5.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (`db: Session = Depends(get_db)`)
# relies on calling Depends() -- and dependency-factories like
# require_permission(code) -- in argument defaults; that's correct here, not
# the mutable-default footgun B008 normally guards against.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "app.modules.auth.dependencies.require_permission",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
